<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同時翻訳ルーム</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="join" class="card">
    <h1>同時翻訳ルーム</h1>
    <p class="muted">話した言葉が、参加者それぞれの言語でリアルタイムに字幕表示されます。</p>
    <label>ルーム名<input id="room" placeholder="my-meeting" /></label>
    <label>表示名<input id="name" placeholder="たろう" maxlength="32" /></label>
    <label>あなたの言語<select id="lang"></select></label>
    <button id="joinBtn" class="primary">参加する</button>
  </main>

  <section id="app" hidden>
    <header>
      <div class="title">
        <strong id="roomTitle"></strong>
        <span id="status" class="dot" title="接続状態"></span>
        <button id="inviteBtn" class="ghost">招待 (QR コード)</button>
        <button id="leaveBtn" class="ghost">退出</button>
      </div>
      <div class="controls">
        <select id="langSwitch" title="表示言語"></select>
        <select id="mode" title="音声認識方式">
          <option value="browser">ブラウザ音声認識 (最速)</option>
          <option value="server">サーバー認識 (Whisper)</option>
        </select>
        <label class="toggle"><input type="checkbox" id="tts" /> 読み上げ</label>
        <button id="micBtn" class="primary">🎙 話す</button>
      </div>
    </header>
    <div id="participants" class="participants"></div>
    <div id="captions" class="captions"></div>
    <div id="meter"><div id="meterBar"></div></div>
  </section>

  <dialog id="inviteDlg" class="invite">
    <h2>ルーム「<span id="inviteRoom"></span>」に招待</h2>
    <p class="muted">スマホのカメラで読み取ると、このルームの参加画面が開きます。</p>
    <div id="qr" class="qr"></div>
    <code id="inviteUrl" class="url"></code>
    <div class="row">
      <button id="copyBtn" class="primary">リンクをコピー</button>
      <button id="closeDlg">閉じる</button>
    </div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
